              <span className="text-xs font-bold tracking-widest uppercase text-teal">Chronological Agenda</span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-darkgreen mt-2 mb-3">
                Scientific Program
              </h2>
              <p className="text-sm font-bold tracking-wider uppercase text-forest">
                WEDNESDAY, NOVEMBER 25, 2026 • HALL OF THE NRC RESEARCHERS&apos; CLUB

              <div className="flex flex-wrap justify-center gap-2 mt-4">

                    key={c}

                <>
                  <div className="bg-white rounded-xl p-5 border-l-4 border-teal shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div className="flex items-center gap-3">
                      <span className="px-3 py-1 rounded bg-teal/15 text-teal font-bold text-xs">
                        {openingBlock.registration.time}
                      </span>
                      <span className="font-bold text-darkgreen text-base">
                        {openingBlock.registration.title}
                      </span>
                    </div>
                    <span className="text-xs font-bold text-gray-500">
                      {openingBlock.registration.duration}
                    </span>
                  </div>

                  <div className="bg-white rounded-xl p-5 border-l-4 border-gold shadow-sm">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b border-gray-100">
                      <div className="flex flex-wrap items-center gap-3">
                        <span className="px-3 py-1 rounded bg-gold/20 text-darkgreen font-bold text-xs">
                          {openingBlock.opening.time}
                        </span>
                        <span className="font-bold text-darkgreen text-base">
                          {openingBlock.opening.title}
                        </span>
                      </div>
                      <span className="text-xs font-bold text-teal">
                        {openingBlock.opening.duration}

                    </div>
                    <ul className="space-y-1.5 text-sm text-gray-700">
                      {openingBlock.opening.remarks.map((rem, i) => (
                        <li key={i} className="flex flex-wrap items-baseline gap-1.5">
                          <span className="font-bold text-forest">{rem.name}</span>
                          <span>— {rem.role}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </>
              )}

              {schedule.map((item, idx) => {
                if (item.type === "transition") {
                  if (selectedCountry !== "ALL") return null;
                  return (
                    <div key={idx} className="flex items-center justify-center py-1">
                      <span className="px-4 py-1 rounded-full bg-gray-200/80 text-gray-600 text-[11px] font-bold tracking-widest uppercase">
                        {item.label}
                      </span>
                    </div>
                  );
                }

                if (item.type === "break") {
                  if (selectedCountry !== "ALL") return null;
                  return (
                    <div
                      key={idx}
                      className="my-6 rounded-xl bg-gradient-to-r from-darkgreen via-forest to-darkgreen text-white p-5 shadow-md border-l-4 border-gold flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2"

                      <div className="flex items-center gap-3">

        ? ""

        ? sp.bio

      return (
        <div className="bg-cream/50 border border-forest/15 rounded-2xl p-6 flex flex-col items-center text-center hover:shadow-lg transition">

              <img src={sp.portraitUrl} alt={sp.speaker} className="w-full h-full object-cover" />

              <div className="flex flex-col items-center text-forest/60">
                <Icon name="user" className="w-10 h-10" />
                <span className="text-[9px] uppercase tracking-wider mt-1 font-semibold">Photo Slot</span>
              </div>

          <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white border border-forest/15 text-xs font-bold text-darkgreen mb-3">

            {sp.affiliation}

              </span>
              <p className="text-xs text-gray-700 leading-relaxed">
                {displayedBio}
              </p>

                <button
                  type="button"
                  onClick={() => setExpanded(!expanded)}

            <span className="text-[10px] font-bold uppercase tracking-wider text-teal block mb-1">

              “{sp.title}”
            </p>
          </div>
        </div>

    };

    const SpeakersSection = () => {
      const speakers = WORKSHOP_DATA.schedule.filter((item) => item.type === "lecture");

      return (
        <section id="speakers" className="py-20 bg-white">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-14">
              <span className="text-xs font-bold tracking-widest uppercase text-teal">Keynote Contributors</span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-darkgreen mt-2 mb-4">
                International Speakers
              </h2>
              <div className="w-20 h-1 bg-gold mx-auto mb-4"></div>

                <SpeakerCard key={sp.number} sp={sp} />

    };

    const ProjectSection = () => {
      const { project } = WORKSHOP_DATA;
      return (
        <section id="project" className="py-20 bg-darkgreen text-white">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

              </span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-white mb-4">
                About the ANSO Research Project
              </h2>
              <div className="w-20 h-1 bg-gold mx-auto mb-6"></div>
              <blockquote className="text-lg sm:text-xl font-serif italic text-gray-100 leading-relaxed bg-white/5 border border-white/15 rounded-xl p-6">

                </div>
                <div className="mt-4 pt-4 border-t border-white/15">
                  <span className="text-xs uppercase tracking-widest text-gold font-bold">Principal Investigator</span>
                  <p className="text-sm font-semibold text-gray-100 mt-1">{project.piName}</p>
                  <p className="text-xs text-gray-300 mt-0.5">{project.piAffiliation}</p>

              <div className="lg:col-span-2 bg-forest/60 border border-white/15 rounded-xl p-6 flex flex-col justify-between">

                  </p>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">

                  <div className="flex flex-wrap gap-2">
                    {project.sdgs.map((sdg) => (
                      <span

                  >

              <h3 className="font-serif text-xl sm:text-2xl font-bold text-gold mb-4">
                Key Scientific Objectives
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5 text-sm text-gray-200">
                {project.objectives.map((obj, idx) => (
                  <div key={idx} className="flex items-start gap-2.5">
                    <span className="px-2 py-0.5 rounded bg-gold/20 text-gold font-bold text-xs shrink-0 mt-0.5">
                      {idx + 1}
                    </span>
                    <p className="leading-relaxed">{obj}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    const PartnersSection = () => {
      const { partners } = WORKSHOP_DATA.logos;
      return (
        <section id="partners" className="py-20 bg-cream border-b border-forest/10">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-12">
              <span className="text-xs font-bold tracking-widest uppercase text-teal">Institutional Consortium</span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-darkgreen mt-2 mb-4">
                Organizers &amp; International Partners
              </h2>
              <div className="w-20 h-1 bg-gold mx-auto"></div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              {partners.map((partner, idx) => (
                <div
                  key={idx}
                  className={`rounded-xl p-6 flex flex-col items-center justify-between text-center border transition ${
                    idx === 0
                      ? "bg-white border-2 border-gold shadow-md"
                      : "bg-white border-forest/15 shadow-sm"
                  }`}
                >
                  <div className="w-full h-24 rounded-lg bg-cream/70 border border-dashed border-forest/30 flex items-center justify-center p-3 mb-4">
                    {partner.logoUrl ? (
                      <img src={partner.logoUrl} alt={partner.name} className="max-h-full max-w-full object-contain" />
                    ) : (
                      <span className="text-xs font-bold text-forest/60 uppercase tracking-wider">
                        Official Logo Placeholder
                      </span>
                    )}
                  </div>
                  <div>
                    <h3 className="font-bold text-sm text-darkgreen leading-snug">{partner.name}</h3>
                    <span className="inline-block mt-2 text-[11px] font-semibold text-teal">

                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>

      );

    const VenueSection = () => {
      const { identity, contact } = WORKSHOP_DATA;
      return (
        <section id="venue" className="py-20 bg-white">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-12">
              <span className="text-xs font-bold tracking-widest uppercase text-teal">Location &amp; Schedule</span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-darkgreen mt-2 mb-4">
                Venue &amp; Event Information
              </h2>
              <div className="w-20 h-1 bg-gold mx-auto"></div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
              <div className="bg-cream rounded-2xl p-8 border border-forest/15 flex flex-col justify-center space-y-6">
                <div className="flex items-start gap-4">
                  <div className="p-3 rounded-xl bg-forest text-gold">
                    <Icon name="calendar" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-gray-500">Date</h3>
                    <p className="text-lg font-bold text-darkgreen">{identity.date}</p>
                  </div>
                </div>

                <div className="flex items-start gap-4">
                  <div className="p-3 rounded-xl bg-forest text-gold">
                    <Icon name="clock" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-gray-500">Time</h3>
                    <p className="text-lg font-bold text-darkgreen">{identity.timeRange}</p>
                  </div>
                </div>

                <div className="flex items-start gap-4">
                  <div className="p-3 rounded-xl bg-forest text-gold">
                    <Icon name="building-2" className="w-6 h-6" />
                  </div>
                  <div>
                    <h3 className="text-xs font-bold uppercase tracking-wider text-gray-500">Venue</h3>
                    <p className="text-lg font-bold text-darkgreen">{identity.venueShort}</p>
                    <p className="text-sm text-gray-700">{identity.institution}</p>
                    <p className="text-xs text-gray-500 mt-1">{contact.address}</p>
                  </div>
                </div>
              </div>

              <div className="rounded-2xl overflow-hidden border border-forest/20 shadow-sm bg-cream flex flex-col min-h-[320px]">
                <iframe
                  title="NRC Venue Location Map"
                  src={contact.mapEmbedUrl}
                  className="w-full flex-grow min-h-[270px] border-0"
                  loading="lazy"
                  referrerPolicy="no-referrer-when-downgrade"
                  allowFullScreen
                ></iframe>
                <div className="bg-darkgreen text-white px-4 py-2.5 flex items-center justify-between text-xs">
                  <span className="text-gray-200">30°02&apos;09.5&quot;N 31°12&apos;29.3&quot;E</span>
                  <a
                    href={contact.mapExternalUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="inline-flex items-center gap-1 font-bold text-gold hover:underline"
                  >
                    <Icon name="external-link" className="w-3.5 h-3.5" />

              </div>

          </div>
        </section>
      );

    const ContactRegistrationSection = () => {
      const { actionUrl, entries } = WORKSHOP_DATA.registrationForm;

      const [formData, setFormData] = useState({
        fullName: "",
        email: "",
        institution: "",
        country: "",
        affiliation: ""
      });
      const [submitted, setSubmitted] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);

        const payload = new URLSearchParams();
        payload.append(entries.fullName, formData.fullName);
        payload.append(entries.email, formData.email);
        payload.append(entries.institution, formData.institution);
        payload.append(entries.country, formData.country);
        payload.append(entries.affiliation, formData.affiliation);

        try {
          await fetch(actionUrl, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
            },
            body: payload.toString()
          });
          setSubmitted(true);
        } catch (err) {
          alert("There was a network issue while sending your registration. Please try again.");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <section id="register" className="py-20 bg-cream border-t border-forest/15">
          <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center max-w-3xl mx-auto mb-12">
              <span className="text-xs font-bold tracking-widest uppercase text-teal">Participation</span>
              <h2 className="font-serif text-3xl sm:text-4xl font-bold text-darkgreen mt-2 mb-4">
                Workshop Registration
              </h2>
              <div className="w-20 h-1 bg-gold mx-auto"></div>
            </div>

            <div className="bg-white rounded-2xl p-8 shadow-sm border border-forest/15">
              {submitted ? (
                <div className="p-8 rounded-xl bg-forest/10 border border-forest text-center">
                  <div className="w-12 h-12 rounded-full bg-forest text-white flex items-center justify-center mx-auto mb-3">
                    <Icon name="check" className="w-6 h-6" />
                  </div>
                  <h4 className="font-bold text-xl text-darkgreen mb-2">
                    Registration Submitted Successfully
                  </h4>
                  <p className="text-sm text-gray-700 mb-4">
                    Thank you, <strong>{formData.fullName}</strong> ({formData.institution}, {formData.country}). Your registration has been recorded.
                  </p>
                  <button
                    onClick={() => {
                      setSubmitted(false);
                      setFormData({ fullName: "", email: "", institution: "", country: "", affiliation: "" });
                    }}
                    className="px-5 py-2 rounded-lg bg-forest text-white text-xs font-bold hover:bg-darkgreen transition"
                  >
                    Submit Another Entry
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-darkgreen mb-1">Full Name *</label>
                      <input
                        type="text"
                        required
                        value={formData.fullName}
                        onChange={(e) => setFormData({ ...formData, fullName: e.target.value })}
                        placeholder="e.g., Prof. Dr. Jane Doe"
                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-forest focus:outline-none text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-darkgreen mb-1">Email Address *</label>
                      <input
                        type="email"
                        required
                        value={formData.email}
                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                        placeholder="researcher@institution.edu"
                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-forest focus:outline-none text-sm"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-darkgreen mb-1">Institution / Organization *</label>
                      <input
                        type="text"
                        required
                        value={formData.institution}
                        onChange={(e) => setFormData({ ...formData, institution: e.target.value })}
                        placeholder="University or Research Centre"
                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-forest focus:outline-none text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-darkgreen mb-1">Country *</label>
                      <input
                        type="text"
                        required
                        value={formData.country}
                        onChange={(e) => setFormData({ ...formData, country: e.target.value })}
                        placeholder="e.g., Egypt"
                        className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-forest focus:outline-none text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-darkgreen mb-1">Professional Affiliation / Academic Title *</label>
                    <input
                      type="text"
                      required
                      value={formData.affiliation}
                      onChange={(e) => setFormData({ ...formData, affiliation: e.target.value })}
                      placeholder="e.g., Associate Professor, Department of Agricultural Engineering"
                      className="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:border-forest focus:outline-none text-sm"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={submitting}
                    className="w-full sm:w-auto px-8 py-3.5 rounded-lg bg-forest text-white font-bold text-sm hover:bg-darkgreen disabled:opacity-60 transition shadow-md flex items-center justify-center gap-2"
                  >
                    <Icon name="send" className="w-4 h-4" />
                    {submitting ? "Submitting..." : "Submit Registration"}
                  </button>
                </form>
              )}
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => (
      <footer className="bg-darkgreen text-gray-300 py-10 border-t-4 border-gold">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
          <div>
            <p className="font-serif font-bold text-white text-lg">{WORKSHOP_DATA.identity.shortName}</p>
            <p className="text-xs text-gray-400 mt-1">
              {WORKSHOP_DATA.identity.fullTitle} • Project {WORKSHOP_DATA.project.number}
            </p>
          </div>
          <div className="text-xs text-gray-400">
            {WORKSHOP_DATA.identity.date} | {WORKSHOP_DATA.identity.institution}
          </div>
        </div>
      </footer>
    );

    const App = () => (
      <div className="min-h-screen flex flex-col">
        <Navbar />
        <main className="flex-grow">
          <Hero />
          <AboutWorkshop />
          <ScientificProgram />
          <SpeakersSection />
          <ProjectSection />
          <PartnersSection />
          <VenueSection />
          <ContactRegistrationSection />
        </main>
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
